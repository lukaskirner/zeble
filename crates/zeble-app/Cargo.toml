[package]
name = "zeble-app"
description = "Zeble: a read-mostly PostgreSQL browser built with GPUI."
version.workspace = true
edition.workspace = true

[[bin]]
name = "zeble"
path = "src/main.rs"

[dependencies]
zeble-core = { path = "../zeble-core" }
gpui-kit = { version = "=0.9.1", features = ["tree-sitter-sql"] }
anyhow = "1"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
