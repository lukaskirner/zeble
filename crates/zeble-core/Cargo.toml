[package]
name = "zeble-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
deadpool-postgres = "0.14.2"
dirs = "7.0.0"
futures-util = "0.3.34"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
