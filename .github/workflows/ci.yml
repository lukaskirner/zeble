# Clippy and tests on pull requests into master and pushes to master.
# The release workflow calls this too, before it builds the macOS app.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Clippy and tests
    runs-on: ubuntu-24.04
    services:
      # The fixture database the integration tests expect (see docker-compose.yml).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zeble
          POSTGRES_PASSWORD: zeble
          POSTGRES_DB: zeble
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U zeble"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig-dev \
            libfreetype-dev libssl-dev libzstd-dev postgresql-client

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Seed the fixture database
        env:
          PGPASSWORD: zeble
        run: psql -h localhost -p 55432 -U zeble -d zeble -v ON_ERROR_STOP=1 -f fixtures/seed.sql

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
